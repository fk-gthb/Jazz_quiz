<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one centred listening card, settings strip above, score below. A concert programme in bottle green and gilt */
:root{
  --ink:#0d1714; --panel:#14221d; --line:#26382f; --fg:#ece7db; --muted:#a3ada6;
  --gilt:#d9b25f; --gilt-dim:#86703f; --good:#7fc79a; --bad:#e2735f;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--fg);font:15px/1.55 var(--body);min-height:100vh;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gilt);margin:0 0 4px}
h1{font:700 clamp(34px,8vw,52px)/.95 var(--display);margin:0;text-wrap:balance}
h1 em{font-weight:500;color:var(--gilt)}
.sub{color:var(--muted);font-size:13px;margin:8px 0 0}
.score{font:500 12px var(--mono);color:var(--muted);text-align:right}
.score b{display:block;font:700 38px/1 var(--display);color:var(--gilt)}
.settings{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:1 1 160px}
select,input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--gilt);outline-offset:1px}
button{font:600 14px var(--body);cursor:pointer;border-radius:6px;border:1px solid var(--gilt);background:transparent;color:var(--gilt);padding:10px 16px}
button.solid{background:var(--gilt);color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:18px}
.count{font:500 12px var(--mono);color:var(--muted);letter-spacing:.06em}
.player{display:flex;align-items:center;gap:18px}
.disc{position:relative;width:96px;height:96px;flex:none}
.disc svg{position:absolute;inset:0;transform:rotate(-90deg)}
.disc button{position:absolute;inset:10px;border-radius:50%;border:none;background:var(--gilt);color:var(--ink);font-size:26px;padding:0;display:grid;place-items:center}
.ptext{min-width:0}
.ptext strong{font:700 24px/1.05 var(--display);display:block}
.ptext small{color:var(--muted)}
.fields{display:grid;gap:12px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.reveal{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.answer h2{font:700 28px/1.1 var(--display);margin:0;text-wrap:balance}
.answer .who{margin:6px 0 0;font-size:16px}
.answer p{margin:3px 0 0;color:var(--muted)}
.rec{font-size:13px;color:var(--muted)}
.rec b{color:var(--fg);font-weight:500}
.checks{display:grid;gap:6px}
.chk{display:grid;grid-template-columns:22px 92px 1fr auto;gap:8px;align-items:center;font-size:14px}
.chk .mark{font-weight:600}
.chk.ok .mark{color:var(--good)} .chk.no .mark{color:var(--bad)}
.chk .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chk .yours{min-width:0;overflow-wrap:anywhere;color:var(--muted)}
.chk button{padding:3px 8px;font-size:12px;border-color:var(--line);color:var(--muted)}
.note{border-left:3px solid var(--gilt-dim);padding:2px 0 2px 12px;font-size:14px}
a{color:var(--gilt)}
.err{color:var(--bad);font-size:13px}
.summary ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.summary h2{font:700 34px/1 var(--display);margin:0}
@media (max-width:440px){.chk{grid-template-columns:22px 1fr auto}.chk .yours{grid-column:2/4}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">100 works · Bach to Pärt</p>
      <h1>Classical <em>Blindfold</em> Test</h1>
      <p class="sub">Hear 20 seconds. Name the work, the composer and the era.</p>
    </div>
    <div class="score"><b id="scoreBig">0</b><span id="scoreSmall">points this round</span></div>
  </header>

  <div class="settings">
    <label for="fEra">Era<select id="fEra"></select></label>
    <label for="fSize">Round<select id="fSize"><option value="10">10 pieces</option><option value="20">20 pieces</option><option value="999">All pieces</option></select></label>
    <button id="newRound" class="solid" type="button">New round</button>
  </div>

  <section class="card" id="card"></section>
  <p class="sub">Previews are Apple's free 30-second clips, so you need an internet connection. Nothing about the piece is shown until you reveal it.</p>
</div>

const ERAS=[["Baroque","1600–1750"],["Classical","1750–1820"],["Romantic","1820–1900"],["Late Romantic","1890–1925"],["Impressionism","1890–1930"],["20th century","1910 onwards"]];
const ERA_RANGE=Object.fromEntries(ERAS);
const T=[{"era":"Baroque","composer":"Antonio Vivaldi","work":"The Four Seasons: Spring","detail":"I. Allegro","year":"1725","keys":["vivaldi"],"alt":["spring","four seasons","primavera","fruhling","vier jahreszeiten","quatre saisons"],"note":"Birdsong imitated by solo violins over a bright string refrain. Vivaldi printed little sonnets in the score describing each scene.","term":"Vivaldi The Four Seasons: Spring","clip":"AudioPreview211/v4/98/b4/e8/98b4e8d4-20a8-8b25-f922-a10978d55f20/mzaf_16547077927177363580","perf":"Berliner Philharmoniker & Nigel Kennedy"},{"era":"Baroque","composer":"Antonio Vivaldi","work":"The Four Seasons: Summer","detail":"III. Presto","year":"1725","keys":["vivaldi"],"alt":["summer","four seasons","estate","sommer","vier jahreszeiten","quatre saisons"],"note":"A violent summer hailstorm: furious tremolos and rushing scales in a minor key.","term":"Vivaldi The Four Seasons: Summer","clip":"AudioPreview211/v4/67/ae/d2/67aed27c-722b-b96a-6a2f-d5279c3db37f/mzaf_9033616072854918763","perf":"Berliner Philharmoniker & Nigel Kennedy"},{"era":"Baroque","composer":"Johann Sebastian Bach","work":"Toccata and Fugue in D minor","detail":"BWV 565","year":"c. 1705","keys":["bach"],"alt":["toccata","toccata fugue"],"note":"The organ's descending flourish and dramatic pauses make it the most famous opening in the organ repertoire.","term":"Bach Toccata and Fugue in D minor","clip":"AudioPreview221/v4/e3/9a/9b/e39a9ba0-6ffd-3fc1-c56f-a18755dedac6/mzaf_9001273229950192607","perf":"Karl Richter"},{"era":"Baroque","composer":"Johann Sebastian Bach","work":"Air on the G String","detail":"Orchestral Suite No. 3, BWV 1068: Air","year":"c. 1730","keys":["bach"],"alt":["air","air g string","orchestral suite 3","suite 3"],"note":"A long, floating violin line over a slowly walking bass. The nickname comes from a 19th-century arrangement played on the violin's lowest string.","term":"Bach Air on the G String","clip":"AudioPreview211/v4/1d/e1/95/1de19538-1e44-c7db-026c-a970bf53b796/mzaf_7233901933941002937","perf":"Yo-Yo Ma, Amsterdam Baroque Orchestra & Ton Koopman"},{"era":"Baroque","composer":"Johann Sebastian Bach","work":"Brandenburg Concerto No. 3","detail":"I. (Allegro)","year":"1721","keys":["bach"],"alt":["brandenburg","brandenburg 3","brandenburgisches konzert"],"note":"Nine string parts in three groups, tossing one busy motif between them. No soloist: the whole ensemble is the star.","term":"Bach Brandenburg Concerto No. 3","clip":"AudioPreview211/v4/c5/10/72/c51072a9-7b1e-9177-88f3-46d4ed39d218/mzaf_14535217642426305075","perf":"Rinaldo Alessandrini & Concerto Italiano"},{"era":"Baroque","composer":"Johann Sebastian Bach","work":"Cello Suite No. 1","detail":"Prelude, BWV 1007","year":"c. 1720","keys":["bach"],"alt":["cello suite","cello suite 1","suite 1","cellosuite"],"note":"Rolling arpeggios on a solo cello that outline the harmony. Pablo Casals rescued the suites from obscurity.","term":"Bach Cello Suite No. 1","clip":"AudioPreview221/v4/14/fa/80/14fa8096-1000-d96b-b2e8-57dc75312b94/mzaf_3227490558007429731","perf":"Yo-Yo Ma"},{"era":"Baroque","composer":"Johann Sebastian Bach","work":"Goldberg Variations","detail":"Aria, BWV 988","year":"1741","keys":["bach"],"alt":["goldberg","goldberg variations","goldberg variationen"],"note":"A gentle, ornamented sarabande that opens and closes a set of 30 variations. Glenn Gould's recordings made it famous.","term":"Bach Goldberg Variations","clip":"AudioPreview211/v4/eb/af/19/ebaf1951-bd44-9526-f240-b73ff37168e9/mzaf_11387021779103602260","perf":"Glenn Gould"},{"era":"Baroque","composer":"Johann Sebastian Bach","work":"Jesu, Joy of Man's Desiring","detail":"Cantata BWV 147","year":"1723","keys":["bach"],"alt":["jesu joy","jesus bleibet meine freude","jesus bleibet","jesu joy mans desiring"],"note":"Flowing triplets in strings and oboe wrap around a calm chorale melody sung by the choir.","term":"Bach Jesu, Joy of Man's Desiring","clip":"AudioPreview211/v4/09/c6/75/09c6752f-bcb1-d487-116b-8ac7f34fe72f/mzaf_8669183487375373537","perf":"John Eliot Gardiner, Monteverdi Choir & English Baroque Soloists"},{"era":"Baroque","composer":"Johann Sebastian Bach","work":"Prelude in C major","detail":"Well-Tempered Clavier, Book I, BWV 846","year":"1722","keys":["bach"],"alt":["prelude c","prelude c major","well tempered clavier","wohltemperierte klavier","prelude 1"],"note":"Pure broken chords, one pattern per bar, moving through a chain of harmonies. Gounod later wrote his Ave Maria on top of it.","term":"Bach Prelude in C major","clip":"AudioPreview211/v4/9f/26/06/9f2606a7-da2c-4db0-fd9b-1b09451ef479/mzaf_14287511790154774436","perf":"Lang Lang"},{"era":"Baroque","composer":"Johann Sebastian Bach","work":"Badinerie","detail":"Orchestral Suite No. 2, BWV 1067","year":"c. 1739","keys":["bach"],"alt":["badinerie","orchestral suite 2","suite 2"],"note":"A quick, playful showpiece for solo flute. Badinerie means 'jest'.","term":"Bach Badinerie","clip":"AudioPreview211/v4/9a/88/e9/9a88e91a-4bbc-7e22-c4c3-00368ad6f6f5/mzaf_9632838764509241049","perf":"Berliner Barock Solisten & Emmanuel Pahud"},{"era":"Baroque","composer":"George Frideric Handel","work":"Hallelujah Chorus","detail":"Messiah","year":"1742","keys":["handel","haendel"],"alt":["hallelujah","messiah","halleluja"],"note":"Massive choral shouts with trumpets and timpani. Audiences traditionally stand for it.","term":"Handel Hallelujah Chorus","clip":"AudioPreview125/v4/b0/25/78/b025785f-e410-5f2d-f797-88d91a8ff692/mzaf_6552654218024740935","perf":"Mark Stephenson & London Musici Chamber Choir"},{"era":"Baroque","composer":"George Frideric Handel","work":"Water Music: Alla Hornpipe","detail":"Suite No. 2 in D major","year":"1717","keys":["handel","haendel"],"alt":["water music","wassermusik","hornpipe","musique sur l eau"],"note":"Brilliant horns and trumpets trading phrases with the strings. Written for King George I's barge party on the Thames.","term":"Handel Water Music: Alla Hornpipe","clip":"AudioPreview125/v4/1a/3c/ec/1a3cec76-5a47-5b39-e488-33abf9a2f4bf/mzaf_823003775595939826","perf":"Jordi Savall"},{"era":"Baroque","composer":"George Frideric Handel","work":"The Arrival of the Queen of Sheba","detail":"Solomon","year":"1749","keys":["handel","haendel"],"alt":["queen sheba","sheba","konigin von saba","solomon"],"note":"Two oboes chattering over busy strings. A cheerful entrance from the oratorio Solomon.","term":"Handel The Arrival of the Queen of Sheba","clip":"AudioPreview115/v4/fa/5d/10/fa5d101b-4767-aff2-deb5-3ebb200d5f96/mzaf_1517807460228574454","perf":"Royal Philharmonic Orchestra & Sir Charles Groves"},{"era":"Baroque","composer":"Johann Pachelbel","work":"Canon in D","detail":"","year":"c. 1690","keys":["pachelbel"],"alt":["canon","canon d","kanon"],"note":"A bass line of eight notes repeats over and over while three violins enter one after another with the same melody.","term":"Pachelbel Canon in D","clip":"AudioPreview221/v4/83/92/be/8392bef2-fb23-d263-4c73-65ecf761c9d0/mzaf_9360076210629254126","perf":"Berliner Philharmoniker & Herbert von Karajan"},{"era":"Baroque","composer":"Henry Purcell","work":"Dido's Lament","detail":"Dido and Aeneas: 'When I am laid in earth'","year":"1689","keys":["purcell"],"alt":["dido lament","dido","when i am laid in earth","dido aeneas","remember me"],"note":"A chromatic bass line descends again and again beneath Dido's farewell. Her cry 'Remember me' is one of opera's great moments.","term":"Purcell Dido's Lament","clip":"AudioPreview125/v4/10/56/81/10568194-68c4-510c-2e19-e8e217a7631e/mzaf_4295936930100120937","perf":"Susan Graham, Le Concert d'Astrée & Emmanuelle Haïm"},{"era":"Baroque","composer":"Gregorio Allegri","work":"Miserere","detail":"","year":"c. 1638","keys":["allegri"],"alt":["miserere"],"note":"Unaccompanied choir with a soaring high C from the treble. The Vatican kept it secret until the 14-year-old Mozart wrote it down from memory.","term":"Allegri Miserere","clip":"AudioPreview116/v4/a6/65/a4/a665a442-ef9d-31d8-8347-96ed674356f9/mzaf_14724643030463740678","perf":"Choir of St John's College, Cambridge & George Guest"},{"era":"Classical","composer":"Wolfgang Amadeus Mozart","work":"Eine kleine Nachtmusik","detail":"I. Allegro","year":"1787","keys":["mozart"],"alt":["eine kleine nachtmusik","kleine nachtmusik","little night music","serenade 13"],"note":"A rising 'rocket' figure in unison strings, then crisp, elegant phrases. Probably Mozart's best-known tune.","term":"Mozart Eine kleine Nachtmusik","clip":"AudioPreview221/v4/59/d0/99/59d099e7-8da8-14a3-c4cf-acb6e780f9d6/mzaf_10151116943140119826","perf":"Berliner Philharmoniker & Herbert von Karajan"},{"era":"Classical","composer":"Wolfgang Amadeus Mozart","work":"Symphony No. 40","detail":"I. Molto allegro","year":"1788","keys":["mozart"],"alt":["symphony 40","g minor symphony","sinfonie 40"],"note":"A restless, sighing melody in the violins over pulsing violas. One of only two minor-key symphonies Mozart wrote.","term":"Mozart Symphony No. 40","clip":"AudioPreview211/v4/97/31/fe/9731fea8-e50b-3208-bc1e-de9916e19357/mzaf_14529199425360378947","perf":"Scottish Chamber Orchestra & Sir Charles Mackerras"},{"era":"Classical","composer":"Wolfgang Amadeus Mozart","work":"Lacrimosa","detail":"Requiem in D minor","year":"1791","keys":["mozart"],"alt":["lacrimosa","requiem"],"note":"Weeping, rising choral lines in a slow 12/8. Mozart reportedly broke off composing here, shortly before his death.","term":"Mozart Lacrimosa","clip":"AudioPreview221/v4/28/d3/b4/28d3b487-0f29-3d53-a87d-e6c6b3dc1bc5/mzaf_2839139378785025985","perf":"Wiener Singverein, Berliner Philharmoniker & Herbert von Karajan"},{"era":"Classical","composer":"Wolfgang Amadeus Mozart","work":"Queen of the Night Aria","detail":"The Magic Flute: 'Der Hölle Rache'","year":"1791","keys":["mozart"],"alt":["queen night","der holle rache","holle rache","magic flute","zauberflote","flute enchantee","konigin der nacht"],"note":"Staccato coloratura leaps up to a high F. The furious Queen orders her daughter to kill her rival.","term":"Mozart Queen of the Night Aria","clip":"AudioPreview125/v4/f5/19/c8/f519c81e-92ec-1256-6d38-d172cfd3f09f/mzaf_12523567515728644460","perf":"Diana Damrau, Le Cercle de l'Harmonie & Jérémie Rhorer"},{"era":"Classical","composer":"Wolfgang Amadeus Mozart","work":"Rondo alla turca","detail":"Piano Sonata No. 11, III","year":"1783","keys":["mozart"],"alt":["rondo alla turca","alla turca","turkish march","turkischer marsch","piano sonata 11"],"note":"A bustling rondo imitating the Ottoman military bands that fascinated Vienna, with crashing 'cymbal' chords in the left hand.","term":"Mozart Rondo alla turca","clip":"AudioPreview211/v4/ae/aa/81/aeaa810b-d134-dfac-c2a0-4f4641a31025/mzaf_4731704263130382598","perf":"Finghin Collins"},{"era":"Classical","composer":"Wolfgang Amadeus Mozart","work":"Clarinet Concerto","detail":"II. Adagio","year":"1791","keys":["mozart"],"alt":["clarinet concerto","klarinettenkonzert"],"note":"A serene, singing clarinet line over soft strings. Used in the film Out of Africa.","term":"Mozart Clarinet Concerto","clip":"AudioPreview221/v4/ea/3d/ab/ea3dab21-4dd0-50ad-4adf-452d12d6c00e/mzaf_2114415172384757139","perf":"Fabio Di Casola, Musikkollegium Winterthur & Douglas Boyd"},{"era":"Classical","composer":"Wolfgang Amadeus Mozart","work":"Piano Concerto No. 21","detail":"II. Andante","year":"1785","keys":["mozart"],"alt":["piano concerto 21","elvira madigan","klavierkonzert 21"],"note":"Muted strings and plucked bass under a long, dreamy piano melody. Nicknamed 'Elvira Madigan' after a 1967 film.","term":"Mozart Piano Concerto No. 21","clip":"AudioPreview211/v4/f8/32/60/f8326032-5e1c-1566-d941-543139295251/mzaf_8030880201492510339","perf":"Finghin Collins, London Philharmonic Orchestra & David Parry"},{"era":"Classical","composer":"Wolfgang Amadeus Mozart","work":"The Marriage of Figaro: Overture","detail":"","year":"1786","keys":["mozart"],"alt":["figaro","marriag // answer checking: word-based, order-free, tolerant of small spelling slips
const NUM={first:1,second:2,third:3,fourth:4,fifth:5,sixth:6,seventh:7,eighth:8,ninth:9,tenth:10,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7,viii:8,ix:9};
const STOP=new Set(["the","a","an","of","in","on","for","and","no","nr","nb","number","op","opus","de","la","le","les","l","d","der","die","das","des","du","di","un","une","en","to","from","with","s"]);
function toks(s){
  return (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/ß/g,"ss").replace(/['’]/g,"")
    .replace(/(\d+)(st|nd|rd|th|e|er|eme|te|ten)\b/g,"$1").replace(/[^a-z0-9]+/g," ").trim().split(" ")
    .filter(Boolean).map(w=>NUM[w]!==undefined&&!(w==="i"||w==="v")?String(NUM[w]):w).filter(w=>!STOP.has(w));
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const near=(w,t)=>w===t||(t.length>=5&&w.length>=4&&1-lev(w,t)/Math.max(w.length,t.length)>=.78);
function phraseIn(ans,phrase){const a=toks(ans),p=toks(phrase);return p.length>0&&a.length>0&&p.every(t=>a.some(w=>near(w,t)))}
function titleOk(ans,t){if(toks(ans).length===0)return false;return [t.work,...t.alt].some(x=>phraseIn(ans,x))}
function composerOk(ans,t){if(toks(ans).length===0)return false;return t.keys.some(k=>phraseIn(ans,k))}

}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function startRound(list){stop();round=list;idx=0;results=[];updScore();renderQ()}
function newRound(){
  const era=$("#fEra").value,size=+$("#fSize").value;store.set("cbt_settings",{era,size:String(size)});
  startRound(shuffle(T.filter(t=>!era||t.era===era)).slice(0,size));
}
function points(){return results.reduce((s,x)=>s+(x?Object.values(x.ok).filter(Boolean).length:0),0)}
function updScore(){$("#scoreBig").textContent=points();$("#scoreSmall").textContent=`of ${round.length*3} points this round`}
function setRing(f){const c=$("#ring");if(c)c.style.strokeDashoffset=283*(1-f)}
function stop(){if(audio){audio.pause();audio=null}clearInterval(tick);setRing(0);const b=$("#playBtn");if(b)b.textContent="▶"}

function renderQ(){
  revealed=false;const t=round[idx];
  $("#card").innerHTML=`
   <div class="count">PIECE ${idx+1} / ${round.length}</div>
   <div class="player">
     <div class="disc">
       <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--line)" stroke-width="5"/><circle id="ring" cx="50" cy="50" r="45" fill="none" stroke="var(--gilt)" stroke-width="5" stroke-dasharray="283" stroke-dashoffset="283" stroke-linecap="round"/></svg>
       <button id="playBtn" type="button" aria-label="Play the clip">▶</button>
     </div>
     <div class="ptext"><strong id="pStatus">Press play</strong><small id="pHint">${CLIP}-second extract, details hidden</small></div>
   </div>
   <form class="fields" id="ansForm" autocomplete="off">
     <label for="aWork">Work<input id="aWork" placeholder="e.g. Moonlight Sonata"></label>
     <label for="aComp">Composer<input id="aComp" placeholder="e.g. Beethoven"></label>
     <label for="aEra">Era<select id="aEra"><option value="">Choose the era…</option>${ERAS.map(([e,r])=>`<option value="${e}">${e} (${r})</option>`).join("")}</select></label>
     <div class="row"><button class="solid" type="submit">Reveal</button><button type="button" id="skipBtn">I don't know</button></div>
   </form>
   <div id="rev"></div>`;
  $("#playBtn").onclick=()=>play(t);
  $("#ansForm").onsubmit=e=>{e.preventDefault();reveal(t)};
  $("#skipBtn").onclick=()=>reveal(t);
}

async function play(t){
  if(audio&&!audio.paused){stop();$("#pStatus").textContent="Play again";return}
  stop();
  audio=new Audio(PBASE+t.clip+PEXT);
  $("#pStatus").textContent="Loading…";
  try{await audio.play()}catch(e){$("#pStatus").textContent="No clip";$("#pHint").innerHTML='<span class="err">The preview didn\'t load. Check your connection, or reveal the answer and use the Apple Music link.</span>';audio=null;return}
  $("#playBtn").textContent="■";$("#pStatus").textContent="Listening";
  const start=Date.now(),max=revealed?30:CLIP;
  tick=setInterval(()=>{const s=(Date.now()-start)/1000;setRing(Math.min(s/max,1));
    if(s>=max||(audio&&audio.ended)){stop();$("#pStatus").textContent="Play again"}},100);
}

function reveal(t){
  if(revealed)return;revealed=true;
  const ans={work:$("#aWork").value,comp:$("#aComp").value,era:$("#aEra").value};
  results[idx]={t,ans,ok:{work:titleOk(ans.work,t),comp:composerOk(ans.comp,t),era:ans.era===t.era}};
  $("#ansForm").querySelectorAll("input,select,button").forEach(el=>el.disabled=true);
  $("#pHint").textContent="Replay now plays the full 30-second preview";
  const yr=document.createElement("div");yr.className="reveal";
  yr.innerHTML=`
    <div class="answer"><h2>${esc(t.work)}</h2>
      <p class="who">${esc(t.composer)}</p>
      <p>${t.detail?esc(t.detail)+" · ":""}${esc(t.year)}</p>
      <p>${esc(t.era)} (${ERA_RANGE[t.era]})</p></div>
    <div class="rec">Recording: <b>${esc(t.perf)}</b></div>
    <div class="checks" id="checks"></div>
    <div class="note">${esc(t.note)}</div>
    <div class="row"><button class="solid" id="nextBtn" type="button">${idx+1<round.length?"Next piece":"See results"}</button>
    <a href="https://music.apple.com/search?term=${encodeURIComponent(t.term)}" target="_blank" rel="noopener">Open in Apple Music</a></div>`;
  $("#rev").appendChild(yr);
  drawChecks();
  $("#nextBtn").onclick=()=>{stop();idx++;idx<round.length?renderQ():summary()};
  $("#nextBtn").focus();
}
function drawChecks(){
  const r=results[idx];updScore();
  const rows=[["work","Work",r.ans.work],["comp","Composer",r.ans.comp],["era","Era",r.ans.era]];
  $("#checks").innerHTML=rows.map(([k,l,v])=>`<div class="chk ${r.ok[k]?"ok":"no"}"><span class="mark">${r.ok[k]?"✓":"✗"}</span><span class="lab">${l}</span><span class="yours">${v?esc(v):"—"}</span><button type="button" data-k="${k}">${r.ok[k]?"Count wrong":"Count right"}</button></div>`).join("");
  $("#checks").querySelectorAll("button").forEach(b=>b.onclick=()=>{r.ok[b.dataset.k]=!r.ok[b.dataset.k];drawChecks()});
}

function summary(){
  const pts=points(),miss=results.filter(r=>!(r.ok.work&&r.ok.comp&&r.ok.era));
  const best=store.get("cbt_best")||0;if(pts>best)store.set("cbt_best",pts);
  $("#card").innerHTML=`<div class="summary"><div class="count">ROUND COMPLETE</div>
   <h2>${pts} / ${round.length*3} points</h2>
   <p class="sub">Best round so far: ${Math.max(best,pts)} points.</p>
   ${miss.length?`<p style="margin:14px 0 0">To listen to again:</p><ul>${miss.map(r=>`<li><strong style="color:var(--fg)">${esc(r.t.work)}</strong>, ${esc(r.t.composer)} (${esc(r.t.era)}, ${esc(r.t.year)})</li>`).join("")}</ul>`:'<p>Perfect round.</p>'}
   </div><div class="row"><button class="solid" type="button" id="again">Play another round</button>${miss.length?'<button type="button" id="retry">Retry only the misses</button>':""}</div>`;
  $("#again").onclick=newRound;
  const rb=$("#retry");if(rb)rb.onclick=()=>startRound(shuffle(miss.map(r=>r.t)));
}

fillSelects();$("#newRound").onclick=newRound;newRound();
</script>
</body>
</html>

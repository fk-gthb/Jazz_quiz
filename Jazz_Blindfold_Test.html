<style>
/* Layout: one centred listening card, settings strip above, score below — a record sleeve in ink and brass */
:root{
  --ink:#10141f; --panel:#181e2d; --line:#2a3247; --fg:#ece6d8; --muted:#9aa1b4;
  --brass:#e2a93b; --brass-dim:#8a6a2c; --good:#6fc28b; --bad:#e2735f;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--fg);font:15px/1.55 var(--body);min-height:100vh;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:800 clamp(38px,9vw,60px)/.9 var(--display);letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--brass)}
.sub{color:var(--muted);font-size:13px;margin:6px 0 0}
.score{font:500 13px var(--mono);color:var(--muted);text-align:right}
.score b{display:block;font:800 34px/1 var(--display);color:var(--brass)}
.settings{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:1 1 160px}
select,input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
button{font:600 14px var(--body);cursor:pointer;border-radius:6px;border:1px solid var(--brass);background:transparent;color:var(--brass);padding:10px 16px}
button.solid{background:var(--brass);color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:18px}
.count{font:500 12px var(--mono);color:var(--muted);letter-spacing:.06em}
.player{display:flex;align-items:center;gap:18px}
.disc{position:relative;width:96px;height:96px;flex:none}
.disc svg{position:absolute;inset:0;transform:rotate(-90deg)}
.disc button{position:absolute;inset:10px;border-radius:50%;border:none;background:var(--brass);color:var(--ink);font-size:26px;padding:0;display:grid;place-items:center}
.ptext{min-width:0}
.ptext strong{font:800 24px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;display:block}
.ptext small{color:var(--muted)}
.fields{display:grid;gap:12px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.reveal{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.answer h2{font:800 30px/1 var(--display);text-transform:uppercase;margin:0;text-wrap:balance}
.answer p{margin:4px 0 0;color:var(--muted)}
.checks{display:grid;gap:6px}
.chk{display:grid;grid-template-columns:22px 92px 1fr auto;gap:8px;align-items:center;font-size:14px}
.chk .mark{font-weight:600}
.chk.ok .mark{color:var(--good)} .chk.no .mark{color:var(--bad)}
.chk .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chk .yours{min-width:0;overflow-wrap:anywhere;color:var(--muted)}
.chk button{padding:3px 8px;font-size:12px;border-color:var(--line);color:var(--muted)}
.note{border-left:3px solid var(--brass-dim);padding:2px 0 2px 12px;font-size:14px}
a{color:var(--brass)}
.err{color:var(--bad);font-size:13px}
.summary ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.summary h2{font:800 34px/1 var(--display);text-transform:uppercase;margin:0}
@media (max-width:440px){.chk{grid-template-columns:22px 1fr auto}.chk .yours{grid-column:2/4}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Blindfold <span>Test</span></h1>
      <p class="sub">Hear 20 seconds. Name the tune, the musician and the era.</p>
    </div>
    <div class="score"><b id="scoreBig">0</b><span id="scoreSmall">points this round</span></div>
  </header>

  <div class="settings">
    <label for="fPeriod">Era<select id="fPeriod"></select></label>
    <label for="fSize">Round<select id="fSize"><option value="10">10 tracks</option><option value="20">20 tracks</option><option value="999">All tracks</option></select></label>
    <button id="newRound" class="solid" type="button">New round</button>
  </div>

  <section class="card" id="card"></section>
  <p class="sub">Previews come from Apple's free 30-second clips, so you need an internet connection. Nothing about the track is shown until you reveal it.</p>
</div>

:"AudioPreview221/v4/31/98/6e/31986ea0-a09f-605e-959b-1b1ba1244e09/mzaf_1783895410955153834"};
const PBASE="https://audio-ssl.itunes.apple.com/itunes-assets/",PEXT=".plus.aac.p.m4a";
const cache={};let cbN=0;
const apiUrl=t=>"https://itunes.apple.com/search?media=music&entity=song&limit=25&country=de&term="+encodeURIComponent(t.term);
function pick(t,data){
  const items=(data.results||[]).filter(x=>x.previewUrl);
  const song=norm(t.song).split(" ")[0];
  const score=x=>{let v=0;const tn=norm(x.trackName),an=norm(x.artistName);
    if(tn.includes(norm(t.song)))v+=4;else if(tn.includes(song))v+=2;
    if(t.keys.some(k=>an.includes(norm(k))))v+=3;
    if(/live|remix|cover|karaoke/.test(tn))v-=1;return v};
  items.sort((a,b)=>score(b)-score(a));
  if(!items.length)throw new Error("Apple returned no preview for this track");
  return items[0];
}
function jsonp(url){
  return new Promise((res,rej)=>{
    const name="__it"+(cbN++);const s=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();rej(new Error("no answer from Apple (timeout)"))},9000);
    function cleanup(){clearTimeout(timer);delete window[name];s.remove()}
    window[name]=d=>{cleanup();res(d)};
    s.src=url+"&callback="+name;
    s.onerror=()=>{cleanup();rej(new Error("connection to Apple blocked"))};
    document.head.appendChild(s);
  });
}
async function lookup(t){
  if(cache[t.id])return cache[t.id];
  if(PREV[t.id])return cache[t.id]={previewUrl:PBASE+PREV[t.id]+PEXT};
  let data;
  try{const r=await fetch(apiUrl(t));if(!r.ok)throw new Error("HTTP "+r.status);data=await r.json()}
  catch(e){data=await jsonp(apiUrl(t))}
  return cache[t.id]=pick(t,data);
}

// state
let round=[],idx=0,points=0,results=[],audio=null,tick=null,revealed=false;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function fillSelects(){
  const f=$("#fPeriod");f.innerHTML='<option value="">All eras</option>'+PERIODS.map(p=>`<option>${p}</option>`).join("");
  const s=store.get("bt_settings");if(s){f.value=s.era||"";$("#fSize").value=s.size||"10"}
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function newRound(){
  stop();const era=$("#fPeriod").value,size=+$("#fSize").value;store.set("bt_settings",{era,size:String(size)});
  round=shuffle(T.filter(t=>!era||t.era===era)).slice(0,size);idx=0;points=0;results=[];updScore();renderQ();
}
function updScore(){$("#scoreBig").textContent=points;$("#scoreSmall").textContent=`of ${round.length*3} points this round`}
function stop(){if(audio){audio.pause();audio=null}clearInterval(tick);setRing(0);const b=$("#playBtn");if(b)b.textContent="▶"}
function setRing(f){const c=$("#ring");if(c)c.style.strokeDashoffset=283*(1-f)}

function renderQ(){
  revealed=false;const t=round[idx];
  $("#card").innerHTML=`
   <div class="count">TRACK ${idx+1} / ${round.length}</div>
   <div class="player">
     <div class="disc">
       <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--line)" stroke-width="5"/><circle id="ring" cx="50" cy="50" r="45" fill="none" stroke="var(--brass)" stroke-width="5" stroke-dasharray="283" stroke-dashoffset="283" stroke-linecap="round"/></svg>
       <button id="playBtn" type="button" aria-label="Play the clip">▶</button>
     </div>
     <div class="ptext"><strong id="pStatus">Press play</strong><small id="pHint">${CLIP}-second extract, details hidden</small></div>
   </div>
   <form class="fields" id="ansForm" autocomplete="off">
     <label for="aTitle">Title<input id="aTitle" placeholder="e.g. So What"></label>
     <label for="aMus">Musician / band<input id="aMus" placeholder="e.g. Miles Davis"></label>
     <label for="aEra">Era<select id="aEra"><option value="">Choose the era…</option>${PERIODS.map(p=>`<option>${p}</option>`).join("")}</select></label>
     <div class="row"><button class="solid" type="submit">Reveal</button><button type="button" id="skipBtn">I don't know</button></div>
   </form>
   <div id="rev"></div>`;
  $("#playBtn").onclick=()=>play(t);
  $("#ansForm").onsubmit=e=>{e.preventDefault();reveal(t)};
  $("#skipBtn").onclick=()=>reveal(t);
  lookup(t).catch(()=>{});
}

async function play(t){
  if(audio&&!audio.paused){stop();return}
  $("#pStatus").textContent="Loading…";
  let item;try{item=await lookup(t)}catch(e){$("#pStatus").textContent="No clip";
    const inFrame=window.top!==window.self;
    $("#pHint").innerHTML='<span class="err">'+escapeHtml(e.message||"Couldn't load the preview")+'. '+(inFrame?"This looks like a preview window, which blocks Apple. Download the file and open it in Safari or Chrome.":"Check your connection, or reveal and use the Apple Music link.")+'</span>';return}
  stop();audio=new Audio(item.previewUrl);
  try{await audio.play()}catch(e){$("#pStatus").textContent="Blocked";return}
  $("#playBtn").textContent="■";$("#pStatus").textContent="Listening";
  const start=Date.now(),max=revealed?30:CLIP;
  tick=setInterval(()=>{const s=(Date.now()-start)/1000;setRing(Math.min(s/max,1));
    if(s>=max||audio.ended){stop();$("#pStatus").textContent="Play again"}},100);
}

function reveal(t){
  if(revealed)return;revealed=true;
  const ans={title:$("#aTitle").value,mus:$("#aMus").value,era:$("#aEra").value};
  const r={t,ok:{title:titleOk(ans.title,t),mus:musicianOk(ans.mus,t),era:ans.era===t.era},ans};
  results[idx]=r;
  $("#ansForm").querySelectorAll("input,select,button").forEach(el=>el.disabled=true);
  $("#pHint").textContent="Replay now plays the full 30-second preview";
  const yr=document.createElement("div");yr.className="reveal";
  yr.innerHTML=`
    <div class="answer"><h2>${t.song}</h2><p>${t.musician} · <em>${t.album}</em>, ${t.year}</p><p>${t.era}</p></div>
    <div class="checks" id="checks"></div>
    <div class="note">${t.note}</div>
    <div class="row"><button class="solid" id="nextBtn" type="button">${idx+1<round.length?"Next track":"See results"}</button>
    <a href="https://music.apple.com/search?term=${encodeURIComponent(t.term)}" target="_blank" rel="noopener" style="align-self:center">Open in Apple Music</a></div>`;
  $("#rev").appendChild(yr);
  drawChecks();
  $("#nextBtn").onclick=()=>{stop();idx++;idx<round.length?renderQ():summary()};
  $("#nextBtn").focus();
}
function drawChecks(){
  const r=results[idx];points=results.reduce((s,x)=>s+(x?Object.values(x.ok).filter(Boolean).length:0),0);updScore();
  const rows=[["title","Title",r.ans.title],["mus","Musician",r.ans.mus],["era","Era",r.ans.era]];
  $("#checks").innerHTML=rows.map(([k,l,v])=>`<div class="chk ${r.ok[k]?"ok":"no"}"><span class="mark">${r.ok[k]?"✓":"✗"}</span><span class="lab">${l}</span><span class="yours">${v?escapeHtml(v):"—"}</span>${k!=="era"?`<button type="button" data-k="${k}">${r.ok[k]?"Count wrong":"Count right"}</button>`:"<span></span>"}</div>`).join("");
  $("#checks").querySelectorAll("button").forEach(b=>b.onclick=()=>{r.ok[b.dataset.k]=!r.ok[b.dataset.k];drawChecks()});
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function summary(){
  const miss=results.filter(r=>!(r.ok.title&&r.ok.mus&&r.ok.era));
  const best=store.get("bt_best")||0;if(points>best)store.set("bt_best",points);
  $("#card").innerHTML=`<div class="summary"><div class="count">ROUND COMPLETE</div>
   <h2>${points} / ${round.length*3} points</h2>
   <p class="sub">Best round so far: ${Math.max(best,points)} points.</p>
   ${miss.length?`<p style="margin:14px 0 0">To listen to again:</p><ul>${miss.map(r=>`<li><strong style="color:var(--fg)">${r.t.song}</strong>, ${r.t.musician} (${r.t.era}, ${r.t.year})</li>`).join("")}</ul>`:'<p>Perfect round.</p>'}
   </div><div class="row"><button class="solid" type="button" id="again">Play another round</button>${miss.length?'<button type="button" id="retry">Retry only the misses</button>':""}</div>`;
  $("#again").onclick=newRound;
  const rb=$("#retry");if(rb)rb.onclick=()=>{round=shuffle(miss.map(r=>r.t));idx=0;points=0;results=[];updScore();renderQ()};
}

fillSelects();$("#newRound").onclick=newRound;newRound();
</script>
